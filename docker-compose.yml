services:
  # ==========================================
  # 1. Laravel PHP-FPM Core Application Service
  # ==========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: munchgudlaravel-app:latest
    container_name: munchgud-app
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-munchgud}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD}
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
      CACHE_STORE: database
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-MunchGud}
    volumes:
      - .:/var/www
      - laravel_storage:/var/www/storage
      - /var/www/vendor
      - laravel_build:/var/www/public/build
    depends_on:
      - db

  # ==========================================
  # 2. Nginx Web Server Service
  # ==========================================
  web:
    image: nginx:alpine
    container_name: munchgud-web
    restart: unless-stopped
    ports:
      - "${PORT_HTTP:-80}:80"
    volumes:
      - ./public:/var/www/public
      - laravel_build:/var/www/public/build
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - laravel_storage:/var/www/storage
    depends_on:
      - app

  # ==========================================
  # 3. Persistent MySQL Database Service
  # ==========================================
  db:
    image: mysql:8.0
    container_name: munchgud-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-munchgud}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
    ports:
      - "${PORT_DB:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 4. Laravel Background Queue Worker Service
  # ==========================================
  queue:
    image: munchgudlaravel-app:latest
    container_name: munchgud-queue
    restart: unless-stopped
    command: php artisan queue:work --verbose --tries=3 --timeout=90
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-munchgud}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD}
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
      CACHE_STORE: database
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-MunchGud}
    volumes:
      - .:/var/www
      - laravel_storage:/var/www/storage
      - /var/www/vendor
      - laravel_build:/var/www/public/build
    depends_on:
      - db
      - app

  # ==========================================
  # 5. Laravel Cron Scheduler Service
  # ==========================================
  scheduler:
    image: munchgudlaravel-app:latest
    container_name: munchgud-scheduler
    restart: unless-stopped
    command: sh /var/www/docker/cron.sh
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-munchgud}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD}
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
      CACHE_STORE: database
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-MunchGud}
    volumes:
      - .:/var/www
      - laravel_storage:/var/www/storage
      - /var/www/vendor
      - laravel_build:/var/www/public/build
    depends_on:
      - db
      - app

# ==========================================
# Persistent Volumes Definitions
# ==========================================
volumes:
  mysql_data:
    driver: local
  laravel_storage:
    driver: local
  laravel_public:
    driver: local
  laravel_build:
    driver: local
